<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16071f">
    <title>Sin conexión | ITLA Crush</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at top, #42135c, #16071f 60%); color: #fff; display: grid; place-items: center; padding: 22px; box-sizing: border-box; }
      main { max-width: 460px; padding: 40px 30px; border: 1px solid #715180; border-radius: 24px; background: #210c2b; text-align: center; box-shadow: 0 22px 70px #0d0310b5; }
      h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 4vw, 2rem); }
      p { color: #dbc8e4; line-height: 1.55; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; background: #ff2f92; padding: 0 24px; border-radius: 14px; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      small { display: block; margin-top: 22px; color: #b79dc2; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ahora mismo no tienes conexión</h1>
      <p>ITLA Crush necesita internet para proteger tu sesión y mostrar las confesiones de forma actualizada. Comprueba tu conexión e inténtalo nuevamente.</p>
      <a href="/home">Volver a intentar</a>
      <small>ITLA Crush es un proyecto académico no oficial.</small>
    </main>
  </body>
</html>
