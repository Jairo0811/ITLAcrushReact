name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm test

      - name: Static accessibility gate
        run: npm run check:a11y

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
